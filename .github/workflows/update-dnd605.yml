name: Update for D&D5e 6.0.5
on:
  push:
    paths: ['.dnd605-ready']
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update compatibility and package
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json,re,zipfile,os
          from pathlib import Path
          p=Path("module.json"); d=json.loads(p.read_text(encoding="utf-8")); old=str(d.get("version","1.0.0"))
          m=re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(.*)",old)
          if not m: raise SystemExit(f"Bad version: {old}")
          a,b,c,s=m.groups(); new=f"{a}.{b}.{int(c)+1}{s}"; d["version"]=new
          rel=d.setdefault("relationships",{}); systems=rel.setdefault("systems",[])
          x=next((v for v in systems if v.get("id")=="dnd5e"),None)
          if x is None:
              x={"id":"dnd5e","type":"system","compatibility":{"minimum":"6.0.0","verified":"6.0.5"}}; systems.append(x)
          else:
              comp=x.setdefault("compatibility",{}); comp.setdefault("minimum","6.0.0"); comp["verified"]="6.0.5"; comp.pop("maximum",None)
          dl=str(d.get("download") or ""); oldzip=dl.rsplit("/",1)[-1] if dl else ""
          newzip=oldzip.replace(old,new) if oldzip and old in oldzip else f"{Path.cwd().name.lower()}-v{new}.zip"
          d["download"]=(dl.rsplit("/",1)[0]+"/"+newzip) if dl else f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/main/{newzip}"
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          rp=Path("README.md")
          if rp.exists():
              t=rp.read_text(encoding="utf-8").replace(f"**{old}**",f"**{new}**",1); out=[]
              for line in t.splitlines():
                  if "D&D" in line and "6.0." in line:
                      ms=list(re.finditer(r"6\.0\.\d+",line))
                      if ms:
                          z=ms[-1]; line=line[:z.start()]+"6.0.5"+line[z.end():]
                  out.append(line)
              rp.write_text("\n".join(out)+("\n" if t.endswith("\n") else ""),encoding="utf-8")
          cp=Path("CHANGELOG.md")
          entry=f"## {new}\n\n- Добавлена совместимость с D&D5e 6.0.5.\n- Обновлены манифест и установочный архив модуля.\n- Рабочая логика модуля сохранена без изменений.\n\n"
          if cp.exists():
              t=cp.read_text(encoding="utf-8"); n=t.find("\n")
              cp.write_text((t[:n+1]+"\n"+entry+t[n+1:].lstrip("\n")) if n>=0 else t+"\n\n"+entry,encoding="utf-8")
          for q in Path(".").glob("*.zip"): q.unlink()
          with zipfile.ZipFile(newzip,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for q in sorted(Path(".").rglob("*")):
                  if not q.is_file(): continue
                  r=q.as_posix()
                  if q.name.endswith(".zip") or r in {"README.md","CHANGELOG.md",".dnd605-ready"} or r.split("/",1)[0] in {".git",".github"}: continue
                  z.write(q,r)
          PY
      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git rm --ignore-unmatch .dnd605-ready .github/workflows/update-dnd605.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Обновить совместимость с D&D5e 6.0.5"
          git push
